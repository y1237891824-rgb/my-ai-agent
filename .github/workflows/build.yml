name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: \'3.22.5\'
          channel: \'stable\'
          
      - name: Install Flet
        run: pip install flet
        
      - name: Build APK
        run: flet build apk --verbose
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mera-APK
          path: build/apk
