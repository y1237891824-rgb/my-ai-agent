name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \'3.10\'
      - uses: subosito/flutter-action@v2
        with:
          channel: \'stable\'
      - run: pip install flet
      - run: flet build apk --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: Mera-APK
          path: build/apk
